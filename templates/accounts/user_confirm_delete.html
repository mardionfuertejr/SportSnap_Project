{% extends 'base.html' %}

{% block title %}Delete User — SportSnap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm text-center p-4">
            <h3>Delete User</h3>
            <p class="text-muted">Are you sure you want to delete <strong>{{ object.username }}</strong>? This will remove all their data.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
