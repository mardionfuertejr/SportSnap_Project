{% extends 'base.html' %}

{% block title %}Delete Photo — {{ site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card glass-card border-0 p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill display-4 text-danger mb-3"></i>
                <h3 class="fw-bold">Delete Photo</h3>
                <p class="text-muted">
                    Are you sure you want to permanently delete this photo?
                </p>
                <div class="mb-4">
                    <img src="{{ object.image_url }}" alt="Thumbnail" class="img-thumbnail bg-dark" style="max-height: 150px; object-fit: contain;">
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
