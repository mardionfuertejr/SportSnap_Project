{% extends 'base.html' %}

{% block title %}Upload Photos — SportSnap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="mb-1">Upload Photos</h2>
                <p class="text-muted mb-4">Adding to "{{ album.title }}"</p>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Select Photos</label>
                        {{ form.images }}
                        <small class="form-text text-muted">You can select multiple images at once.</small>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.caption.id_for_label }}" class="form-label">Caption (optional)</label>
                        {{ form.caption }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.sport_tag.id_for_label }}" class="form-label">Sport Tag (optional)</label>
                        {{ form.sport_tag }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Upload</button>
                        <a href="{{ album.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
